# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP SKF Blind SQL Injection (OWASP Security Knowledge Framework labs, by Glenn ten Cate, Riccardo ten Cate and the SKF contributors) as an Isoloom spec:
# a Flask page viewer whose page id goes into a SQL query without showing its result (blind SQL injection). The SKF lab folder python/SQLI-blind is
# vendored unchanged in app/ and built by its own Dockerfile.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: skf-sqli-blind

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.60.131.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    ports: { web: { port: 5000, protocol: http, publish: 5050 } }
    resources: { cpus: 1, memory_mb: 256 }
    files:
      # The player's flag, delivered at each start; the seed step puts it in a flags table of the
      # lab's SQLite database, where the blind SQL injection reaches it. Without the input the
      # inert dev placeholder.
      - path: /run/lab/flag
        input: CTF_FLAG_MAIN
        mode: "0444"
    setup: [ctf/seed-flag.sh]
    app:
      build: app

checks:
  - name: the lab answers
    http: http://web:5000/
    wait: 120
  - name: page 1 is found in the database, an unknown id is not
    script: checks/page.sh

message: |
  OWASP SKF Blind SQL Injection answers at {{ machines.web.ports.web.url }}.
  /home/1 exists and /home/999 does not: the page only tells you yes or no.
